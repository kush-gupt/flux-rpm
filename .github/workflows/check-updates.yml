name: Check for Updates

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

# Ensure only one update check runs at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write        # Push branches (create-pull-request)
  pull-requests: write   # Create PRs (create-pull-request)
  issues: write          # Create issues (create-issue-from-file)
  actions: write         # Trigger build-test workflow on PR branch

jobs:
  # ============================================================
  # Check for version updates and create PRs (matrix strategy)
  # ============================================================
  update:
    name: Update ${{ matrix.package }}
    runs-on: ubuntu-latest
    # fail-fast: false already isolates the matrix cells from each other;
    # a genuine failure (e.g. API errors) should be visible, not green.
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: flux-security
          - package: flux-core
          - package: flux-sched
          - package: flux-accounting
    steps:
      - uses: actions/checkout@v7

      - name: Check for update
        id: check
        env:
          # Authenticated API calls get a 5000 req/hr quota instead of
          # the 60 req/hr unauthenticated per-IP limit shared by all of
          # GitHub Actions.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE="${{ matrix.package }}"
          current=$(grep '^Version:' ${PACKAGE}/${PACKAGE}.spec | awk '{print $2}')
          if [ -z "$current" ]; then
            echo "::error::Could not determine current version from spec file"
            exit 1
          fi
          echo "Current version: $current"
          echo "current=$current" >> $GITHUB_OUTPUT

          # A failed or unparsable release lookup fails the job: exiting
          # 0 here used to hide rate-limit errors behind a green run.
          response=$(curl -sf --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/flux-framework/${PACKAGE}/releases?per_page=1") || {
            echo "::error::Failed to fetch latest release from GitHub API"
            exit 1
          }
          latest=$(echo "$response" | jq -r '.[0].tag_name // empty' | sed 's/^v//')
          if [ -z "$latest" ]; then
            echo "::error::Could not parse version from GitHub API response"
            exit 1
          fi
          echo "Latest version: $latest"

          # The tag flows into sed scripts, the changelog, branch names
          # and URLs below; refuse anything that is not a plain dotted
          # version.
          if ! echo "$latest" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::Unexpected release tag format: v${latest}"
            exit 1
          fi

          if [ "$current" = "$latest" ]; then
            echo "No update available (current: $current)"
            exit 0
          fi

          # Only ever move forward: /releases returns the most recently
          # published release, which can be a patch release for an older
          # series (e.g. 0.53.1 published after 0.54.0 is packaged).
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)" != "$latest" ]; then
            echo "Latest release ($latest) sorts below packaged version ($current); skipping"
            exit 0
          fi

          # Leave an existing, still-mergeable update PR alone.
          # Regenerating it every day only changes the changelog date,
          # which force-pushes the branch (discarding any fixes a
          # reviewer pushed to it) and burns a full build matrix. A
          # CONFLICTING PR (e.g. #94, generated moments before an
          # unrelated spec change landed on main) is regenerated from
          # the current main instead.
          mergeable=$(gh pr list --head "update-${PACKAGE}-${latest}" --state open \
            --json mergeable --jq '.[0].mergeable // empty')
          if [ -n "$mergeable" ] && [ "$mergeable" != "CONFLICTING" ]; then
            echo "Open PR for update-${PACKAGE}-${latest} already exists (mergeable: ${mergeable}); skipping"
            exit 0
          fi

          echo "latest=$latest" >> $GITHUB_OUTPUT
          echo "Update available: $current -> $latest"

      - name: Generate changelog from upstream NEWS
        if: steps.check.outputs.latest != ''
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          PACKAGE="${{ matrix.package }}"

          NEWS=$(curl -sf --retry 3 "https://raw.githubusercontent.com/flux-framework/${PACKAGE}/v${VERSION}/NEWS.md") || {
            echo "::warning::Could not fetch NEWS.md for ${PACKAGE} ${VERSION}"
            NEWS=""
          }

          # Extract the section for this version (between consecutive version headers).
          # Header format: "PACKAGE version X.Y.Z - DATE" followed by a line of dashes.
          # Use awk for robustness across all flux-* projects.
          FROM_RELEASE_BODY=0
          SECTION=""
          if [ -n "$NEWS" ]; then
            ESCAPED_VER=$(echo "$VERSION" | sed 's/\./\\./g')
            SECTION=$(echo "$NEWS" | awk "
              /^${PACKAGE} version ${ESCAPED_VER}/ { found=1; next }
              found && /^${PACKAGE} version [0-9]/ { exit }
              found && /^---/ { next }
              found { print }
            ")
          fi

          if [ -z "$SECTION" ]; then
            # Fall back to the GitHub release notes ("What's Changed" bullets).
            echo "::warning::No NEWS.md section for ${VERSION}; trying release notes"
            RBODY=$(curl -sf --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/flux-framework/${PACKAGE}/releases/tags/v${VERSION}" \
              | jq -r '.body // empty') || RBODY=""
            SECTION=$(echo "$RBODY" | awk '
              /^## What/ { in_sect=1; next }
              in_sect && /^## / { exit }
              in_sect && /^[*-] / { print }
            ' | head -8)
            [ -n "$SECTION" ] && FROM_RELEASE_BODY=1
          fi

          if [ -z "$SECTION" ]; then
            echo "::warning::No usable release notes for ${VERSION}"
            echo "- Update to v${VERSION}" > /tmp/changelog_entries.txt
            HIGHLIGHTS="_No structured highlights extracted — see the release notes link in the PR._"
          else
            if [ "$FROM_RELEASE_BODY" = "1" ]; then
              # Flat "What's Changed" bullets need no section parsing.
              FEATURES=$(echo "$SECTION" | sed 's/^[*-] //; s/ (#[0-9,# ]*)$//; s/`//g')
              FIXES=""
            else
              # Extract feature headlines (handles ##, ###, #### and both
              # "New Features" and "Features" section names).
              # Join continuation lines (non-bullet lines following a bullet)
              # so multi-line entries are not truncated.
              FEATURES=$(echo "$SECTION" | awk '
                /^#{2,4} (New )?Features/ { in_sect=1; next }
                /^#{2,4} / { if (buf) { print buf; buf="" }; in_sect=0 }
                in_sect && /^ {0,1}\* / {
                  if (buf) print buf
                  buf = $0
                  next
                }
                in_sect && buf && /[^ ]/ && !/^ {0,1}\* / {
                  sub(/^[[:space:]]+/, "")
                  buf = buf " " $0
                  next
                }
                END { if (buf) print buf }
              ' | head -5 | sed 's/^ *\* //; s/ (#[0-9,#]*)$//; s/`//g')

              # Extract fix headlines (handles ##, ###, ####)
              FIXES=$(echo "$SECTION" | awk '
                /^#{2,4} Fixes/ { in_sect=1; next }
                /^#{2,4} / { if (buf) { print buf; buf="" }; in_sect=0 }
                in_sect && /^ {0,1}\* / {
                  if (buf) print buf
                  buf = $0
                  next
                }
                in_sect && buf && /[^ ]/ && !/^ {0,1}\* / {
                  sub(/^[[:space:]]+/, "")
                  buf = buf " " $0
                  next
                }
                END { if (buf) print buf }
              ' | head -3 | sed 's/^ *\* //; s/ (#[0-9,#]*)$//; s/`//g')
            fi

            # Build changelog entries
            {
              echo "- Update to v${VERSION}"
              if [ -n "$FEATURES" ]; then
                echo "$FEATURES" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- $line"
                done
              fi
              if [ -n "$FIXES" ]; then
                echo "$FIXES" | while IFS= read -r line; do
                  [ -n "$line" ] && echo "- Fix: $line"
                done
              fi
            } > /tmp/changelog_entries.txt

            # Highlights for the PR body, captured before RPM % escaping.
            HIGHLIGHTS=$(tail -n +2 /tmp/changelog_entries.txt)
            if [ -z "$HIGHLIGHTS" ]; then
              HIGHLIGHTS="_No structured highlights extracted — see the release notes link in the PR._"
            fi
          fi

          # rpmbuild expands %macros inside %changelog too; escape any
          # literal % from the upstream notes (e.g. "50% faster").
          sed -i 's/%/%%/g' /tmp/changelog_entries.txt

          echo "Generated changelog entries:"
          cat /tmp/changelog_entries.txt

          { echo "entries<<CHANGELOG_EOF"; cat /tmp/changelog_entries.txt; echo "CHANGELOG_EOF"; } >> $GITHUB_OUTPUT
          { echo "highlights<<HIGHLIGHTS_EOF"; echo "$HIGHLIGHTS"; echo "HIGHLIGHTS_EOF"; } >> $GITHUB_OUTPUT

      - name: Update spec and sources
        id: update-spec
        if: steps.check.outputs.latest != ''
        env:
          # Derived from the upstream NEWS.md: third-party text, so hand
          # it to the script through the environment instead of
          # interpolating it into the script source.
          ENTRIES: ${{ steps.changelog.outputs.entries }}
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          PACKAGE="${{ matrix.package }}"
          SPEC="${PACKAGE}/${PACKAGE}.spec"

          sed -i "s/^Version:.*/Version: ${VERSION}/" "$SPEC"
          sed -i 's/^Release:.*/Release: 1%{?dist}/' "$SPEC"

          TARBALL="/tmp/${PACKAGE}-${VERSION}.tar.gz"
          curl -sfL -o "$TARBALL" "https://github.com/flux-framework/${PACKAGE}/releases/download/v${VERSION}/${PACKAGE}-${VERSION}.tar.gz" || {
            echo "::error::Failed to download release tarball for ${PACKAGE} ${VERSION}"
            exit 1
          }
          SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "SHA256 (${PACKAGE}-${VERSION}.tar.gz) = ${SHA256}" > ${PACKAGE}/sources

          # Check each patch against the new release. A patch that
          # reverse-applies cleanly has been merged upstream and would
          # break %prep ("Reversed (or previously applied) patch
          # detected!"), so drop it (spec entry, preceding comment
          # block, and patch file) and record a changelog note.
          # Patches that no longer apply at all are left in place and
          # flagged for manual review.
          SRCDIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$SRCDIR"
          : > /tmp/dropped_patches.txt
          : > /tmp/patch_warnings.txt
          dropped=0; kept=0; flagged=0
          # Process substitution (not a pipeline) so the counters below
          # survive the loop.
          while IFS= read -r patchfile; do
            # --fuzz=0 matches how rpmbuild %autosetup applies patches
            if patch -p1 -d "${SRCDIR}/${PACKAGE}-${VERSION}" --dry-run --fuzz=0 -N -s -f < "${PACKAGE}/${patchfile}" >/dev/null 2>&1; then
              echo "Patch still applies cleanly, keeping: ${patchfile}"
              kept=$((kept + 1))
            elif patch -p1 -R -d "${SRCDIR}/${PACKAGE}-${VERSION}" --dry-run --fuzz=0 -s -f < "${PACKAGE}/${patchfile}" >/dev/null 2>&1; then
              echo "Patch already applied upstream, dropping: ${patchfile}"
              awk -v patchfile="$patchfile" '
                /^[[:space:]]*$/ || /^#/ { buf = buf $0 ORS; next }
                /^Patch[0-9]*:/ && $2 == patchfile { buf = ""; next }
                { printf "%s", buf; buf = ""; print }
                END { printf "%s", buf }
              ' "$SPEC" > "${SPEC}.tmp" && mv "${SPEC}.tmp" "$SPEC"
              rm -f "${PACKAGE}/${patchfile}"
              echo "- Drop ${patchfile} (applied upstream in ${VERSION})" >> /tmp/dropped_patches.txt
              dropped=$((dropped + 1))
            else
              echo "::warning::Patch ${patchfile} does not apply cleanly to ${PACKAGE} ${VERSION}; manual review needed"
              echo "- ${patchfile} does not apply cleanly to ${VERSION}; manual review needed" >> /tmp/patch_warnings.txt
              flagged=$((flagged + 1))
            fi
          done < <(grep -E '^Patch[0-9]*:' "$SPEC" | awk '{print $2}')

          # New plugins / commands / man-page sections / cron scripts
          # the tarball installs are otherwise left out of %files, and
          # rpmbuild then fails with "Installed (but unpackaged)
          # file(s) found" (0.60.0 fairshare-emulate, 0.61.0
          # resource_quotas + man5, 0.89.0 cron.daily dump/gc). Stale
          # sysconf paths the tarball no longer ships are dropped
          # (0.89.0 kvs-backup.cron).
          : > /tmp/added_files.txt
          ./scripts/sync-spec-files.sh \
            "$SPEC" "${SRCDIR}/${PACKAGE}-${VERSION}" /tmp/added_files.txt

          DATE=$(date -u '+%a %b %d %Y')
          {
            echo "%changelog"
            echo "* ${DATE} github-actions[bot] <github-actions[bot]@users.noreply.github.com> - ${VERSION}-1"
            printf '%s\n' "$ENTRIES"
            cat /tmp/dropped_patches.txt
            cat /tmp/added_files.txt
            echo ""
            sed -n '/%changelog/,$ { /%changelog/d; p }' "$SPEC"
          } > /tmp/changelog
          sed -i '/%changelog/,$ d' "$SPEC"
          cat /tmp/changelog >> "$SPEC"

          # Summaries for the PR body.
          {
            echo "patch_summary<<PATCH_EOF"
            echo "Patches: ${dropped} dropped (applied upstream), ${kept} still apply cleanly, ${flagged} need manual review"
            echo "PATCH_EOF"
            echo "patch_warnings<<WARN_EOF"
            cat /tmp/patch_warnings.txt
            echo "WARN_EOF"
            echo "packaging_notes<<NOTES_EOF"
            if [ -s /tmp/dropped_patches.txt ] || [ -s /tmp/added_files.txt ]; then
              cat /tmp/dropped_patches.txt /tmp/added_files.txt
            else
              echo "No packaging changes needed beyond the version bump."
            fi
            echo "NOTES_EOF"
          } >> $GITHUB_OUTPUT

      - name: Check for new upstream build dependencies
        id: deps
        if: steps.check.outputs.latest != ''
        run: |
          PACKAGE="${{ matrix.package }}"
          CURRENT="${{ steps.check.outputs.current }}"
          LATEST="${{ steps.check.outputs.latest }}"
          SPEC="${PACKAGE}/${PACKAGE}.spec"
          NEW_TARBALL="/tmp/${PACKAGE}-${LATEST}.tar.gz"
          OLD_TARBALL="/tmp/${PACKAGE}-${CURRENT}.tar.gz"

          # Map an upstream dependency token to the RPM capability the
          # spec should BuildRequire. Empty output = not mapped (skipped).
          # Best-effort and informational only: findings are reported in
          # the PR body for a human to verify, never auto-edited.
          map_dep() {
            case "$(echo "$1" | tr '[:upper:]' '[:lower:]')" in
              jansson|hwloc|libarchive|libsodium|libzmq|czmq|sqlite3|uuid|libuuid|ncursesw|liblz4|libsystemd|bash-completion|flux-security)
                echo "pkgconfig($1)" ;;
              lua) echo "lua-devel" ;;
              boost) echo "boost-devel" ;;
              python3|python) echo "python3-devel" ;;
              fluxcore) echo "pkgconfig(flux-core)" ;;
              *) echo "" ;;
            esac
          }

          # Best-effort dependency tokens from the upstream build system.
          # Autotools: PKG_CHECK_MODULES module lists (+ lua macros).
          # CMake: find_package() names.
          extract_deps() {
            local dir=$1
            if [ -f "$dir/configure.ac" ]; then
              grep -h 'PKG_CHECK_MODULES' "$dir/configure.ac" 2>/dev/null | \
                sed -n -E 's/.*PKG_CHECK_MODULES\(\[[^]]+\],[[:space:]]*\[([^]]*)\].*/\1/p' | \
                tr ' ' '\n' | grep -E '^[a-z][a-z0-9+._-]*$' | grep -v -E '^(ge|le|eq|gt|lt)$'
              grep -q -E 'AX_LUA_(HEADERS|LIBS)' "$dir/configure.ac" 2>/dev/null && echo lua
            elif [ -f "$dir/CMakeLists.txt" ]; then
              grep -rhoP 'find_package\(\s*\K[A-Za-z0-9_+-]+' "$dir" --include=CMakeLists.txt 2>/dev/null
            fi
          }

          # Test-only / documentation helpers are not packaging deps.
          denylist='^(catch2|doxygen|sanitizers|codecov|pkgconfig)$'

          NEW_DEPS=""
          if [ ! -f "$OLD_TARBALL" ]; then
            echo "::warning::Current-version tarball not cached; downloading for dependency comparison"
            curl -sfL -o "$OLD_TARBALL" \
              "https://github.com/flux-framework/${PACKAGE}/releases/download/v${CURRENT}/${PACKAGE}-${CURRENT}.tar.gz" || OLD_TARBALL=""
          fi

          if [ -n "$OLD_TARBALL" ] && [ -f "$OLD_TARBALL" ] && [ -f "$NEW_TARBALL" ]; then
            OLD_SRC=$(mktemp -d); NEW_SRC=$(mktemp -d)
            tar -xzf "$OLD_TARBALL" -C "$OLD_SRC"
            # Re-extracting the new tarball keeps this step self-contained
            # (the spec-update step extracted it earlier in this job).
            tar -xzf "$NEW_TARBALL" -C "$NEW_SRC"
            OLD_DIR=$(find "$OLD_SRC" -maxdepth 1 -mindepth 1 -type d | head -1)
            NEW_DIR=$(find "$NEW_SRC" -maxdepth 1 -mindepth 1 -type d | head -1)
            extract_deps "$OLD_DIR" | grep -v -E -i "$denylist" | sort -u > /tmp/old_deps.txt || true
            extract_deps "$NEW_DIR" | grep -v -E -i "$denylist" | sort -u > /tmp/new_deps.txt || true
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              cap=$(map_dep "$dep")
              [ -n "$cap" ] || continue
              if ! grep -qi "^BuildRequires:.*${cap}" "$SPEC"; then
                NEW_DEPS="${NEW_DEPS}- [ ] Upstream added a build dependency on **${dep}** — no matching \`BuildRequires: ${cap}\` in the spec; please verify.\n"
              fi
            done < <(comm -13 /tmp/old_deps.txt /tmp/new_deps.txt)
            rm -rf "$OLD_SRC" "$NEW_SRC"
          else
            echo "::warning::Could not compare upstream dependencies (tarball missing)"
          fi

          if [ -z "$NEW_DEPS" ]; then
            NEW_DEPS="No new upstream build dependencies detected in this release."
          fi
          printf '%b\n' "$NEW_DEPS"
          { echo "new_deps<<DEPS_EOF"; printf '%b\n' "$NEW_DEPS"; echo "DEPS_EOF"; } >> $GITHUB_OUTPUT

      - name: Validate updated spec
        if: steps.check.outputs.latest != ''
        run: |
          # Run the same checks CI will run (the spec-validation job in
          # build-test.yml) before the PR is opened, so an update PR never
          # opens with a broken spec. Same Fedora container approach.
          podman run -d --name specvalidate -v "$PWD:/work" -w /work \
            fedora:latest sleep infinity
          podman exec specvalidate dnf install -y -q rpm-build glibc-langpack-en
          podman exec -i specvalidate bash -s <<'EOF'
          set -euo pipefail
          SPEC="${{ matrix.package }}/${{ matrix.package }}.spec"
          echo "Parsing: $SPEC"
          rpmspec -P "$SPEC" > /dev/null
          echo "  spec parses OK"
          for field in "^Name:" "^Version:" "^Release:" "^License:" "^URL:" "^Source0:" "^%description" "^%changelog"; do
            grep -q "$field" "$SPEC" || { echo "::error::Missing $field in $SPEC"; exit 1; }
          done
          echo "  required fields present"
          BAD=$(sed -n '/%changelog/,$ p' "$SPEC" | grep -E '^\* ' | \
            grep -vE '^\* (Mon|Tue|Wed|Thu|Fri|Sat|Sun) (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) +[0-9]{1,2} [0-9]{4} .+ - [^ ]+$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Malformed changelog entry header(s) in $SPEC:"
            echo "$BAD"
            exit 1
          fi
          echo "  changelog format OK"
          EOF

      - name: Remove validation container
        if: always()
        run: podman rm -f -t 0 specvalidate 2>/dev/null || true

      - name: Find or create tracking issue
        id: create-issue
        if: steps.check.outputs.latest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Update ${{ matrix.package }} to ${{ steps.check.outputs.latest }}"
          # 'gh issue list --search' is a fuzzy match; require the exact
          # title so e.g. a 0.54.0 issue is never reused for 0.54.0.1.
          EXISTING=$(gh issue list --search "\"$TITLE\" in:title" --state open --json number,title \
            | jq -r --arg title "$TITLE" '[.[] | select(.title == $title)][0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "issue-number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Reusing existing issue #$EXISTING"
          else
            BODY="New ${{ matrix.package }} release detected.

          **Current version:** ${{ steps.check.outputs.current }}
          **New version:** ${{ steps.check.outputs.latest }}
          **Release:** https://github.com/flux-framework/${{ matrix.package }}/releases/tag/v${{ steps.check.outputs.latest }}

          An automated PR has been created with the version bump. Please review:
          - [ ] Check release notes for spec file changes
          - [ ] Verify patches are still needed for this version
          - [ ] Verify BuildRequires are still correct
          - [ ] Test build locally if possible"
            NUM=$(gh issue create --title "$TITLE" --body "$BODY" --label enhancement --label ${{ matrix.package }} | grep -oP '\d+$')
            echo "issue-number=$NUM" >> "$GITHUB_OUTPUT"
            echo "Created issue #$NUM"
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check.outputs.latest != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update ${{ matrix.package }} to ${{ steps.check.outputs.latest }}"
          title: "Update ${{ matrix.package }} to ${{ steps.check.outputs.latest }}"
          body: |
            Automated version bump for ${{ matrix.package }} from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}.

            Release: https://github.com/flux-framework/${{ matrix.package }}/releases/tag/v${{ steps.check.outputs.latest }}
            Upstream changes: https://github.com/flux-framework/${{ matrix.package }}/compare/v${{ steps.check.outputs.current }}...v${{ steps.check.outputs.latest }}

            Closes #${{ steps.create-issue.outputs.issue-number }}

            ### Upstream highlights
            ${{ steps.changelog.outputs.highlights }}

            ### Automated checks
            - [x] Spec validation passed (`rpmspec` parse, required fields, changelog format)
            - [x] ${{ steps.update-spec.outputs.patch_summary }}
            - [x] `%files` synced against the new release tarball

            ### Build dependencies
            ${{ steps.deps.outputs.new_deps }}

            ### Packaging changes in this PR
            ${{ steps.update-spec.outputs.packaging_notes }}
            ${{ steps.update-spec.outputs.patch_warnings }}

            ### Still needs a human
            - [ ] Skim the release notes for behavior or config changes that affect packaging

            ---
            *Opened by the Check for Updates workflow. The build matrix runs automatically on this PR.*
          branch: update-${{ matrix.package }}-${{ steps.check.outputs.latest }}
          delete-branch: true
          labels: dependencies, ${{ matrix.package }}
          assignees: ${{ github.repository_owner }}

      - name: Trigger build CI on PR branch
        # Only when this run actually created or refreshed the PR;
        # 'none' means the branch content was already up to date.
        if: >-
          steps.create-pr.outputs.pull-request-operation == 'created' ||
          steps.create-pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="update-${{ matrix.package }}-${{ steps.check.outputs.latest }}"
          HEAD_SHA="${{ steps.create-pr.outputs.pull-request-head-sha }}"

          # PRs opened with the repo GITHUB_TOKEN are documented not to
          # start pull_request workflows, but in practice these update
          # PRs do get one (see #94: the dispatched run and a
          # pull_request run built the same commit twice). Give the
          # event a moment to materialize and dispatch only if no run
          # showed up, so each update is built exactly once either way.
          sleep 30
          existing=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build-test.yml/runs?event=pull_request&head_sha=${HEAD_SHA}" \
            --jq '.total_count')
          if [ "${existing:-0}" -gt 0 ]; then
            echo "build-test already triggered for ${HEAD_SHA} by the pull_request event; skipping dispatch"
            exit 0
          fi
          echo "Triggering Build and Test RPMs on branch: $BRANCH"
          gh workflow run build-test.yml --ref "$BRANCH"
