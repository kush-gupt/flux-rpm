name: Check for Updates

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

# Ensure only one update check runs at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write        # Push branches (create-pull-request)
  pull-requests: write   # Create PRs (create-pull-request)
  issues: write          # Create issues (create-issue-from-file)
  actions: write         # Trigger build-test workflow on PR branch

jobs:
  # ============================================================
  # Check for version updates and create PRs (matrix strategy)
  # ============================================================
  update:
    name: Update ${{ matrix.package }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: flux-security
          - package: flux-core
          - package: flux-sched
          - package: flux-accounting
    steps:
      - uses: actions/checkout@v7

      - name: Check for update
        id: check
        run: |
          PACKAGE="${{ matrix.package }}"
          current=$(grep '^Version:' ${PACKAGE}/${PACKAGE}.spec | awk '{print $2}')
          if [ -z "$current" ]; then
            echo "::error::Could not determine current version from spec file"
            exit 1
          fi
          echo "Current version: $current"
          echo "current=$current" >> $GITHUB_OUTPUT

          response=$(curl -sf "https://api.github.com/repos/flux-framework/${PACKAGE}/releases?per_page=1") || {
            echo "::warning::Failed to fetch latest release from GitHub API"
            exit 0
          }
          latest=$(echo "$response" | jq -r '.[0].tag_name // empty' | sed 's/^v//')
          if [ -z "$latest" ]; then
            echo "::warning::Could not parse version from GitHub API response"
            exit 0
          fi
          echo "Latest version: $latest"

          if [ "$current" != "$latest" ]; then
            echo "latest=$latest" >> $GITHUB_OUTPUT
            echo "Update available: $current -> $latest"
          else
            echo "No update available (current: $current)"
          fi

      - name: Generate changelog from upstream NEWS
        if: steps.check.outputs.latest != ''
        id: changelog
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          PACKAGE="${{ matrix.package }}"

          NEWS=$(curl -sf "https://raw.githubusercontent.com/flux-framework/${PACKAGE}/v${VERSION}/NEWS.md") || {
            echo "::warning::Could not fetch NEWS.md, using minimal changelog"
            echo "- Update to v${VERSION}" > /tmp/changelog_entries.txt
            { echo "entries<<CHANGELOG_EOF"; cat /tmp/changelog_entries.txt; echo "CHANGELOG_EOF"; } >> $GITHUB_OUTPUT
            exit 0
          }

          # Extract the section for this version (between consecutive version headers).
          # Header format: "PACKAGE version X.Y.Z - DATE" followed by a line of dashes.
          # Use awk for robustness across all flux-* projects.
          ESCAPED_VER=$(echo "$VERSION" | sed 's/\./\\./g')
          SECTION=$(echo "$NEWS" | awk "
            /^${PACKAGE} version ${ESCAPED_VER}/ { found=1; next }
            found && /^${PACKAGE} version [0-9]/ { exit }
            found && /^---/ { next }
            found { print }
          ")

          if [ -z "$SECTION" ]; then
            echo "::warning::Could not extract NEWS section for ${VERSION}"
            echo "- Update to v${VERSION}" > /tmp/changelog_entries.txt
            { echo "entries<<CHANGELOG_EOF"; cat /tmp/changelog_entries.txt; echo "CHANGELOG_EOF"; } >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract feature headlines (handles ##, ###, #### and both
          # "New Features" and "Features" section names).
          # Join continuation lines (non-bullet lines following a bullet)
          # so multi-line entries are not truncated.
          FEATURES=$(echo "$SECTION" | awk '
            /^#{2,4} (New )?Features/ { in_sect=1; next }
            /^#{2,4} / { if (buf) { print buf; buf="" }; in_sect=0 }
            in_sect && /^ {0,1}\* / {
              if (buf) print buf
              buf = $0
              next
            }
            in_sect && buf && /[^ ]/ && !/^ {0,1}\* / {
              sub(/^[[:space:]]+/, "")
              buf = buf " " $0
              next
            }
            END { if (buf) print buf }
          ' | head -5 | sed 's/^ *\* //; s/ (#[0-9,#]*)$//; s/`//g')

          # Extract fix headlines (handles ##, ###, ####)
          FIXES=$(echo "$SECTION" | awk '
            /^#{2,4} Fixes/ { in_sect=1; next }
            /^#{2,4} / { if (buf) { print buf; buf="" }; in_sect=0 }
            in_sect && /^ {0,1}\* / {
              if (buf) print buf
              buf = $0
              next
            }
            in_sect && buf && /[^ ]/ && !/^ {0,1}\* / {
              sub(/^[[:space:]]+/, "")
              buf = buf " " $0
              next
            }
            END { if (buf) print buf }
          ' | head -3 | sed 's/^ *\* //; s/ (#[0-9,#]*)$//; s/`//g')

          # Build changelog entries
          {
            echo "- Update to v${VERSION}"
            if [ -n "$FEATURES" ]; then
              echo "$FEATURES" | while IFS= read -r line; do
                [ -n "$line" ] && echo "- $line"
              done
            fi
            if [ -n "$FIXES" ]; then
              echo "$FIXES" | while IFS= read -r line; do
                [ -n "$line" ] && echo "- Fix: $line"
              done
            fi
          } > /tmp/changelog_entries.txt

          echo "Generated changelog entries:"
          cat /tmp/changelog_entries.txt

          { echo "entries<<CHANGELOG_EOF"; cat /tmp/changelog_entries.txt; echo "CHANGELOG_EOF"; } >> $GITHUB_OUTPUT

      - name: Update spec and sources
        if: steps.check.outputs.latest != ''
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          PACKAGE="${{ matrix.package }}"
          SPEC="${PACKAGE}/${PACKAGE}.spec"

          sed -i "s/^Version:.*/Version: ${VERSION}/" "$SPEC"
          sed -i 's/^Release:.*/Release: 1%{?dist}/' "$SPEC"

          TARBALL="/tmp/${PACKAGE}-${VERSION}.tar.gz"
          curl -sfL -o "$TARBALL" "https://github.com/flux-framework/${PACKAGE}/releases/download/v${VERSION}/${PACKAGE}-${VERSION}.tar.gz" || {
            echo "::error::Failed to download release tarball for ${PACKAGE} ${VERSION}"
            exit 1
          }
          SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "SHA256 (${PACKAGE}-${VERSION}.tar.gz) = ${SHA256}" > ${PACKAGE}/sources

          # Check each patch against the new release. A patch that
          # reverse-applies cleanly has been merged upstream and would
          # break %prep ("Reversed (or previously applied) patch
          # detected!"), so drop it (spec entry, preceding comment
          # block, and patch file) and record a changelog note.
          # Patches that no longer apply at all are left in place and
          # flagged for manual review.
          SRCDIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$SRCDIR"
          : > /tmp/dropped_patches.txt
          grep -E '^Patch[0-9]*:' "$SPEC" | awk '{print $2}' | while IFS= read -r patchfile; do
            # --fuzz=0 matches how rpmbuild %autosetup applies patches
            if patch -p1 -d "${SRCDIR}/${PACKAGE}-${VERSION}" --dry-run --fuzz=0 -N -s -f < "${PACKAGE}/${patchfile}" >/dev/null 2>&1; then
              echo "Patch still applies cleanly, keeping: ${patchfile}"
            elif patch -p1 -R -d "${SRCDIR}/${PACKAGE}-${VERSION}" --dry-run --fuzz=0 -s -f < "${PACKAGE}/${patchfile}" >/dev/null 2>&1; then
              echo "Patch already applied upstream, dropping: ${patchfile}"
              awk -v patchfile="$patchfile" '
                /^[[:space:]]*$/ || /^#/ { buf = buf $0 ORS; next }
                /^Patch[0-9]*:/ && $2 == patchfile { buf = ""; next }
                { printf "%s", buf; buf = ""; print }
                END { printf "%s", buf }
              ' "$SPEC" > "${SPEC}.tmp" && mv "${SPEC}.tmp" "$SPEC"
              rm -f "${PACKAGE}/${patchfile}"
              echo "- Drop ${patchfile} (applied upstream in ${VERSION})" >> /tmp/dropped_patches.txt
            else
              echo "::warning::Patch ${patchfile} does not apply cleanly to ${PACKAGE} ${VERSION}; manual review needed"
            fi
          done

          DATE=$(date -u '+%a %b %d %Y')
          {
            echo "%changelog"
            echo "* ${DATE} github-actions[bot] <github-actions[bot]@users.noreply.github.com> - ${VERSION}-1"
            cat <<'ENTRIES_EOF'
          ${{ steps.changelog.outputs.entries }}
          ENTRIES_EOF
            cat /tmp/dropped_patches.txt
            echo ""
            sed -n '/%changelog/,$ { /%changelog/d; p }' "$SPEC"
          } > /tmp/changelog
          sed -i '/%changelog/,$ d' "$SPEC"
          cat /tmp/changelog >> "$SPEC"

      - name: Find or create tracking issue
        id: create-issue
        if: steps.check.outputs.latest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Update ${{ matrix.package }} to ${{ steps.check.outputs.latest }}"
          EXISTING=$(gh issue list --search "$TITLE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "issue-number=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Reusing existing issue #$EXISTING"
          else
            BODY="New ${{ matrix.package }} release detected.

          **Current version:** ${{ steps.check.outputs.current }}
          **New version:** ${{ steps.check.outputs.latest }}
          **Release:** https://github.com/flux-framework/${{ matrix.package }}/releases/tag/v${{ steps.check.outputs.latest }}

          An automated PR has been created with the version bump. Please review:
          - [ ] Check release notes for spec file changes
          - [ ] Verify patches are still needed for this version
          - [ ] Verify BuildRequires are still correct
          - [ ] Test build locally if possible"
            NUM=$(gh issue create --title "$TITLE" --body "$BODY" --label enhancement --label ${{ matrix.package }} | grep -oP '\d+$')
            echo "issue-number=$NUM" >> "$GITHUB_OUTPUT"
            echo "Created issue #$NUM"
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check.outputs.latest != ''
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update ${{ matrix.package }} to ${{ steps.check.outputs.latest }}"
          title: "Update ${{ matrix.package }} to ${{ steps.check.outputs.latest }}"
          body: |
            Automated version bump for ${{ matrix.package }} from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}.

            Release: https://github.com/flux-framework/${{ matrix.package }}/releases/tag/v${{ steps.check.outputs.latest }}

            Closes #${{ steps.create-issue.outputs.issue-number }}

            Please review:
            - [ ] Check release notes for spec file changes
            - [ ] Verify patches are still needed for this version
            - [ ] Verify BuildRequires are still correct
            - [ ] Test build locally if possible
          branch: update-${{ matrix.package }}-${{ steps.check.outputs.latest }}
          delete-branch: true

      - name: Trigger build CI on PR branch
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="update-${{ matrix.package }}-${{ steps.check.outputs.latest }}"
          echo "Triggering Build and Test RPMs on branch: $BRANCH"
          gh workflow run build-test.yml --ref "$BRANCH"
